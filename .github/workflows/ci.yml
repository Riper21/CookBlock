# CI «Пищеблок» (этап 3): заявка «работает везде».
# Джоб tests — матрица ubuntu/windows, pytest-сьют (47) на каждый пуш/PR
#   (windows = машина разработки; ubuntu = первая реальная проверка
#    кроссплатформенности кода и тестов на Linux)
#   + смоук preflight `main.py --check` без сети и без реальных токенов.
# Docker-этап пропущен по решению пользователя (Этап 4).
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (base + pytest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # pytest-сьют герметичен сам по себе: tests/conftest.py выставляет
      # ключи-заглушки ДО импорта config и уводит DB_PATH в tests/.
      - name: Tests
        run: python -X utf8 -m pytest tests -q
      - name: Preflight smoke (no network, no real tokens)
        env:
          # Заглушки валидного ФОРМАТА (иначе validate_config отвергнет
          # токен - и смоук проверит не то): pytest здесь уже не при делах.
          TELEGRAM_BOT_TOKEN: "1234567890:CI_fake_token_0123456789_abcdefghij"
          DEEPSEEK_API_KEY: "sk-ci-fake-key"
        run: python -X utf8 main.py --check
